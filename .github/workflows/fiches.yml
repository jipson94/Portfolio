# Régénère les pages des projets et des articles + le plan du site (sitemap.xml)
# à chaque publication (depuis l'admin ou à la main), relance la mise en ligne du site,
# puis prévient Bing (IndexNow) des pages qui ont changé.
name: Fiches projets et articles

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - '*.html'
      - 'projets.js'
      - 'articles.js'
      - 'scripts/build-pages.mjs'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: fiches
  cancel-in-progress: false

jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Générer les pages
        run: node scripts/build-pages.mjs
      - name: Enregistrer si quelque chose a changé
        id: commit
        run: |
          git add -A -- 'projet-*.html' 'article-*.html' sitemap.xml index.html formations.html
          if git diff --cached --quiet; then
            echo "change=non" >> "$GITHUB_OUTPUT"
          else
            git config user.name "Generateur du site"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Pages projets/articles et plan du site régénérés [skip ci]"
            git pull --rebase origin main
            git push
            echo "change=oui" >> "$GITHUB_OUTPUT"
          fi
      - name: Relancer la mise en ligne du site
        if: steps.commit.outputs.change == 'oui'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
      - name: Prévenir Bing des pages modifiées (IndexNow)
        continue-on-error: true
        run: |
          AVANT="${{ github.event.before }}"
          if [ -z "$AVANT" ] || ! git cat-file -e "$AVANT" 2>/dev/null; then AVANT="HEAD~1"; fi
          PAGES=$(git diff --name-only "$AVANT" HEAD -- '*.html' | grep -v '/' || true)
          if [ -z "$PAGES" ]; then echo "Aucune page modifiée."; exit 0; fi
          sleep 90   # laisse le temps à la nouvelle version d'être en ligne
          node scripts/indexnow.mjs $PAGES
