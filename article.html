<main>

    <svg class="ast-deco" viewBox="0 0 200 200" aria-hidden="true"><path d="M84 0h32v61.4l43.4-43.4 22.6 22.6L138.6 84H200v32h-61.4l43.4 43.4-22.6 22.6L116 138.6V200H84v-61.4L40.6 182 18 159.4 61.4 116H0V84h61.4L18 40.6 40.6 18 84 61.4z"/></svg>

      </div>

<script src="data/articles.js"></script>

<script src="pubs.js"></script>
<script>
  document.getElementById('y').textContent = new Date().getFullYear();
  const header = document.querySelector('header');
  addEventListener('scroll', () => header.classList.toggle('scrolled', scrollY > 10), {passive:true});
  const burger = document.querySelector('.burger'), nav = document.querySelector('nav');
  burger.addEventListener('click', () => { const o = nav.classList.toggle('open'); burger.setAttribute('aria-expanded', o); });

  // Ancienne adresse « article.html?id=… » : on va sur la vraie page de l'article
  if (!window.PAGE_ID && new URLSearchParams(location.search).get('id')) { location.replace(lienArticle(new URLSearchParams(location.search).get('id'))); throw new Error('Redirection'); }
  const id = new URLSearchParams(location.search).get('id') || window.PAGE_ID;
  const a = ARTICLES.find(x => x.id === id);
  if (!a) {
    // Article introuvable : retour à la liste
    location.replace('actualites.html');
  } else {
    document.title = a.titre + ' — Jipson Mathas';
    document.querySelector('meta[name=description]').setAttribute('content', a.resume);
    document.getElementById('crumb-cat').textContent = a.categorie;
    document.getElementById('a-title').textContent = a.titre;
    document.getElementById('a-meta').innerHTML = `<a class="cat" href="actualites.html?cat=${encodeURIComponent(a.categorie)}">${a.categorie}</a><span>${fmtDate(a.date)}</span><span>· ${a.lecture} de lecture</span>`;
    document.getElementById('a-cover').innerHTML = coverHTML(a);
    document.getElementById('a-body').innerHTML = a.contenu;
    if (a.exemple) document.getElementById('a-meta').insertAdjacentHTML('afterend', '<div><span class="ex-banner">Article exemple — texte d\'illustration en attendant un vrai article</span></div>');

    // Annonces : colonnes à gauche et à droite sur grand écran, encarts dans le texte sur téléphone/tablette
    const pA = pubsDuJour(), pB = pubsDuJour();
    if (pA) {
      const body = document.getElementById('a-body'), kids = [...body.children];
      const at = kids[Math.max(0, Math.floor(kids.length / 2) - 1)];
      if (at) at.insertAdjacentHTML('afterend', pubHTML(pA, 'inline'));
      document.querySelector('.share').insertAdjacentHTML('beforebegin', pubHTML(pB, 'inline'));
      document.querySelector('.article-page').insertAdjacentHTML('beforeend',
        '<div class="pub-rail pub-rail-left">' + pubHTML(pA, 'rail') + '</div><div class="pub-rail pub-rail-right">' + pubHTML(pB, 'rail') + '</div>');
    }

    // Partage
    const url = location.href, txt = a.titre;
    document.getElementById('sh-wa').href = 'https://wa.me/?text=' + encodeURIComponent(txt + ' ' + url);
    document.getElementById('sh-li').href = 'https://www.linkedin.com/sharing/share-offsite/?url=' + encodeURIComponent(url);
    document.getElementById('sh-fb').href = 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(url);
    const copy = document.getElementById('sh-copy');
    copy.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(url); copy.textContent = 'Lien copié ✓'; }
      catch { copy.textContent = 'Copie impossible'; }
      setTimeout(() => copy.textContent = 'Copier le lien', 2000);
    });

    // À lire aussi : 2 autres articles, de préférence de la même catégorie
    const others = ARTICLES.filter(x => x.id !== a.id).sort((x, y) => (y.categorie === a.categorie) - (x.categorie === a.categorie) || y.date.localeCompare(x.date)).slice(0, 2);
    const more = document.getElementById('a-more');
    if (others.length) more.innerHTML = others.map(postCard).join(''); else document.querySelector('.more-posts').remove();
  }
</script>
<script src="data/site.js"></script>
<script src="site.js"></script>
