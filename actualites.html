<script>
  document.getElementById('y').textContent = new Date().getFullYear();
  const header = document.querySelector('header');
  addEventListener('scroll', () => header.classList.toggle('scrolled', scrollY > 10), {passive:true});
  const burger = document.querySelector('.burger'), nav = document.querySelector('nav');
  burger.addEventListener('click', () => { const o = nav.classList.toggle('open'); burger.setAttribute('aria-expanded', o); });

  // Liste de tous les articles, du plus récent au plus ancien
  const list = [...ARTICLES].sort((x, y) => y.date.localeCompare(x.date));
  const postsEl = document.querySelector('.posts'), filtersEl = document.querySelector('.filters'), empty = document.querySelector('.empty');
  // Liste des articles, avec un encart d'annonce toutes les 3 cartes
  postsEl.innerHTML = list.map((a, i) => postCard(a) + ((i + 1) % 3 === 0 && i < list.length - 1 ? pubHTML(pubsDuJour(), 'feed') : '')).join('');

  // Filtres par catégorie (mémorisés dans l'adresse : actualites.html?cat=...)
  const cats = ['Tous', ...new Set(list.map(a => a.categorie))];
  filtersEl.innerHTML = cats.map(c => `<button data-cat="${c}">${c}</button>`).join('');
  function filter(cat) {
    let shown = 0;
    filtersEl.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.cat === cat));
    postsEl.querySelectorAll('.post').forEach(p => { const ok = cat === 'Tous' || p.dataset.cat === cat; p.classList.toggle('hide', !ok); shown += ok; });
    empty.hidden = shown > 0;
    postsEl.querySelectorAll('.pub-slot').forEach(s => { s.hidden = cat !== 'Tous'; });   // annonces seulement sur « Tous »
  }
  filtersEl.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    filter(b.dataset.cat);
    const u = new URL(location); b.dataset.cat === 'Tous' ? u.searchParams.delete('cat') : u.searchParams.set('cat', b.dataset.cat);
    history.replaceState(null, '', u);
  });
  const start = new URLSearchParams(location.search).get('cat');
  filter(cats.includes(start) ? start : 'Tous');
</script>
