# Régénère les pages des projets et des articles + le plan du site (sitemap.xml)
# à chaque publication (depuis l'admin ou à la main), puis relance la mise en ligne du site.
name: Fiches projets et articles

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'projet.html'
      - 'article.html'
      - 'projets.js'
      - 'articles.js'
      - 'scripts/build-pages.mjs'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: fiches
  cancel-in-progress: false

jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Générer les pages
        run: node scripts/build-pages.mjs
      - name: Enregistrer si quelque chose a changé
        id: commit
        run: |
          git add -A -- 'projet-*.html' 'article-*.html' sitemap.xml
          if git diff --cached --quiet; then
            echo "change=non" >> "$GITHUB_OUTPUT"
          else
            git config user.name "Generateur du site"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Pages projets/articles et plan du site régénérés [skip ci]"
            git pull --rebase origin main
            git push
            echo "change=oui" >> "$GITHUB_OUTPUT"
          fi
      - name: Relancer la mise en ligne du site
        if: steps.commit.outputs.change == 'oui'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
